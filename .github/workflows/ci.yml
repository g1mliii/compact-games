name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 3.44 provides the Dart 3.12 SDK required by flutter_riverpod 3.4.
  FLUTTER_VERSION: "3.44.8"
  RUST_TOOLCHAIN: "stable"

jobs:
  formatting:
    name: Check source formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Check Dart formatting
        run: |
          dart format lib test
          git diff --ignore-space-at-eol --exit-code -- lib test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Verify website metadata
        run: python scripts/verify_website_metadata.py

  windows-app:
    name: Validate Windows app
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Verify source version consistency
        run: python scripts/verify_release_source.py

      - name: Install Flutter Rust Bridge code generator
        run: cargo install flutter_rust_bridge_codegen@2.12.0 --locked

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Regenerate Flutter Rust Bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Generate Freezed Dart models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check generated Flutter Rust Bridge bindings
        shell: bash
        run: git diff --exit-code -- lib/src/rust windows/runner/bridge_generated.h

      - name: Regenerate localizations
        run: flutter gen-l10n

      - name: Check generated localizations
        shell: bash
        run: git diff --exit-code -- lib/l10n

      - name: Analyze Flutter code
        run: flutter analyze

      # The native bridge test loads whichever compact_games_core.dll it finds.
      # A cached debug build from an earlier run predates the bindings just
      # regenerated above, and its content-hash check would fail the suite, so
      # drop it and build the library this commit actually describes.
      - name: Drop stale cached Rust library
        shell: pwsh
        run: Remove-Item rust/target/debug/compact_games_core.dll -ErrorAction SilentlyContinue

      - name: Build Rust release library
        run: cargo build --manifest-path rust/Cargo.toml --release

      - name: Run Flutter tests
        run: flutter test

      - name: Lint Rust code
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --all-features

      # The Steam variant is built first because it compiles into the same
      # build/windows/x64/runner/Release directory as the standalone bundle.
      # Building it last would overwrite the standalone artifacts whose hashes
      # the verify step just printed.
      - name: Build and stage Steam distribution variant
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/build-steam-package.ps1
          -AllowMissingCoverProxy

      - name: Verify Steam depot package
        shell: pwsh
        run: |
          $bundle = 'dist/steam/content'
          $requiredFiles = @(
            'compact_games.exe',
            'compact_games_core.dll',
            'flutter_windows.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll',
            'LICENSE.txt',
            'THIRD_PARTY_NOTICES-RUST.txt',
            'compact_games_build.json',
            'data/app.so',
            'data/flutter_assets/AssetManifest.bin',
            'data/flutter_assets/NOTICES.Z'
          )
          foreach ($file in $requiredFiles) {
            $path = Join-Path $bundle $file
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
              throw "Steam release bundle is missing $file."
            }
          }
          # build-steam-package.ps1 derives this value from the dart-define it
          # actually passed to flutter, so a dropped or misspelled define fails
          # the check rather than being restated as a literal.
          $metadata = Get-Content (Join-Path $bundle 'compact_games_build.json') -Raw | ConvertFrom-Json
          if ($metadata.distributionChannel -ne 'steam') {
            throw "Steam provenance marker has channel '$($metadata.distributionChannel)'."
          }
          if ($metadata.coverProxyConfigured) {
            throw 'CI validation must prove that the explicit missing-proxy override is honored.'
          }
          $hashManifest = 'dist/steam/sha256sums.txt'
          if (-not (Test-Path $hashManifest) -or (Get-Item $hashManifest).Length -eq 0) {
            throw 'Steam SHA-256 manifest is missing.'
          }
          $vdfFiles = @(Get-ChildItem 'dist/steam/scripts' -Filter '*.vdf' -File)
          if ($vdfFiles.Count -ne 2) {
            throw "Expected two SteamPipe VDF files, found $($vdfFiles.Count)."
          }
          $vdfText = ($vdfFiles | Get-Content -Raw) -join "`n"
          if ($vdfText -notmatch '__APP_ID__' -or $vdfText -notmatch '__DEPOT_ID__') {
            throw 'Placeholder SteamPipe scripts are missing App or Depot IDs.'
          }

      # The depot content is staged, so the steam-channel binaries and the
      # provenance marker left in the shared output directory must go before
      # the standalone bundle is built there.
      - name: Reset Windows release output
        shell: pwsh
        run: Remove-Item 'build/windows/x64/runner/Release' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Verify Windows release bundle
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          Copy-Item 'rust/target/release/compact_games_core.dll' $bundle -Force
          $requiredFiles = @(
            'compact_games.exe',
            'compact_games_core.dll'
          )
          foreach ($file in $requiredFiles) {
            $path = Join-Path $bundle $file
            if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
              throw "Release bundle is missing $file."
            }
          }
          $marker = Join-Path $bundle 'compact_games_build.json'
          if (Test-Path $marker) {
            $channel = (Get-Content $marker -Raw | ConvertFrom-Json).distributionChannel
            throw "Standalone bundle carries a '$channel'-channel provenance marker."
          }
          Get-FileHash (Join-Path $bundle 'compact_games.exe') -Algorithm SHA256
          Get-FileHash (Join-Path $bundle 'compact_games_core.dll') -Algorithm SHA256

  cloudflare-workers:
    name: Validate Cloudflare workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker:
          - cloudflare/sgdb-cover-proxy
          - cloudflare/unsupported-report-ingest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check Node supply chain
        working-directory: ${{ matrix.worker }}
        run: npm run security:check

      - name: Check worker syntax
        working-directory: ${{ matrix.worker }}
        run: npm run check

      - name: Run worker tests
        working-directory: ${{ matrix.worker }}
        run: npm test

  release-data-export:
    name: Validate release data export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run release data export tests
        run: node --test scripts/test/export-unsupported-community-list.test.mjs
