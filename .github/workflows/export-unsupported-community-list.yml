name: Export Unsupported Community List

on:
  workflow_dispatch:
    inputs:
      min_reporters:
        description: "Minimum unique reporters required"
        required: false
        default: "3"
      min_repeat_reporters:
        description: "Minimum reporters with report_count >= 2"
        required: false
        default: "1"
      max_age_days:
        description: "Ignore submissions older than this many days"
        required: false
        default: "180"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: unsupported-community-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check Node supply-chain guardrails
        run: node ./scripts/check-node-supply-chain.mjs

      - name: Export unsupported community bundle
        env:
          COMPACT_GAMES_UNSUPPORTED_WORKER_URL: ${{ vars.COMPACT_GAMES_UNSUPPORTED_WORKER_URL || 'https://compact-games-unsupported-report-ingest.pressplay-subai.workers.dev' }}
          COMPACT_GAMES_UNSUPPORTED_MIN_REPORTERS: ${{ inputs.min_reporters || '3' }}
          COMPACT_GAMES_UNSUPPORTED_MIN_REPEAT_REPORTERS: ${{ inputs.min_repeat_reporters || '1' }}
          COMPACT_GAMES_UNSUPPORTED_MAX_AGE_DAYS: ${{ inputs.max_age_days || '180' }}
        run: node ./scripts/export-unsupported-community-list.mjs

      - name: Upload export artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsupported-community-list
          path: dist/unsupported-community/
          retention-days: 7
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download unsupported community artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsupported-community-list
          path: dist/unsupported-community/

      - name: Attach unsupported list bundle to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/unsupported-community/unsupported_games.json
            dist/unsupported-community/unsupported_games.bundle.json
